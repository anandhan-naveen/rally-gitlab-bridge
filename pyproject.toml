[project]
name = "rally-gitlab-bridge"
version = "0.2.0"
description = "Selective Rally to GitLab migration and controlled synchronization bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.4,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
rally-gitlab-bridge = "app.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
